# Local development database. Start it with `pnpm db:up` from the repo root.
services:
  postgres:
    image: postgres:17-alpine
    container_name: spendwise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: spendwise
      POSTGRES_PASSWORD: spendwise
      POSTGRES_DB: spendwise
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U spendwise -d spendwise']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
