# Local development database. Start it with `pnpm db:up` from the repo root.
services:
  postgres:
    image: postgres:17-alpine
    container_name: expenseflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: expenseflow
      POSTGRES_PASSWORD: expenseflow
      POSTGRES_DB: expenseflow
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U expenseflow -d expenseflow']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
